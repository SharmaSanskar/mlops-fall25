name: LAB4 - Testing with Unittest

on:
  push:
    branches: [ main ]
    paths:
      - 'LAB_4_GITHUB/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'LAB_4_GITHUB/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        cd LAB_4_GITHUB
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unittests
      run: |
        cd LAB_4_GITHUB
        python -m unittest test.test_unittest -v
    
    - name: Notify on success
      if: success()
      run: echo "✅ LAB4 unittest tests passed successfully!"
    
    - name: Notify on failure
      if: failure()
      run: echo "❌ LAB4 unittest tests failed!"